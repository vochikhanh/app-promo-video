<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
  The stage: one HTML page that draws every frame of every aspect ratio.

    body.v 1080×1920 (9:16)   body.s 1080×1080 (1:1)   body.h 1920×1080 (16:9)   body.f 1080×1350 (4:5)

  build.mjs calls setup(data) once per aspect, then frame(i, t, cap, total, elapsed) for every frame.
  Each frame is a pure function of (scene index, seconds into the scene): no timers, no CSS
  animations, no randomness that is not seeded. That is what makes renders exact and repeatable.

  Scene types: chat (group-chat hook), text (kinetic statement), phone (screenshot/recording in a
  phone or a card), trio (feature tiles), end (call to action). Text wrapped in *stars* is
  highlighted; "\n" breaks the line. Tweak layout per aspect with the .v / .s / .h / .f selectors.
-->
<style>
@font-face { font-family: 'Be Vietnam Pro'; src: url(../fonts/BeVietnamPro-Medium.ttf); font-weight: 500; }
@font-face { font-family: 'Be Vietnam Pro'; src: url(../fonts/BeVietnamPro-SemiBold.ttf); font-weight: 600; }
@font-face { font-family: 'Be Vietnam Pro'; src: url(../fonts/BeVietnamPro-Bold.ttf); font-weight: 700; }
@font-face { font-family: 'Be Vietnam Pro'; src: url(../fonts/BeVietnamPro-ExtraBold.ttf); font-weight: 800; }
:root { --c1: #5B4BE0; --c2: #3A2DB8; --hl: #FFE27A; --font: 'Be Vietnam Pro', system-ui, sans-serif; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { overflow: hidden; font-family: var(--font); color: #fff; background: var(--c2); }
body.v { width: 1080px; height: 1920px; }
body.s { width: 1080px; height: 1080px; }
body.h { width: 1920px; height: 1080px; }
body.f { width: 1080px; height: 1350px; }
#bg { position: absolute; inset: 0; overflow: hidden; background: linear-gradient(150deg, var(--c1) 0%, var(--c2) 100%); }
#bg .blob { position: absolute; width: 900px; height: 900px; border-radius: 50%; filter: blur(120px); }
#bg .b1 { background: rgba(255,255,255,.22); }
#bg .b2 { background: var(--glow, #ff9ad5); opacity: .28; }
#bg svg { position: absolute; inset: 0; width: 100%; height: 100%; }
#brand { position: absolute; display: flex; align-items: center; z-index: 30; font-weight: 800; letter-spacing: -.5px; }
#brand img { border-radius: 24%; box-shadow: 0 6px 20px rgba(0,0,0,.18); }
#brand img[src=""] { display: none; }
.v #brand { left: 64px; top: 72px; gap: 20px; font-size: 46px; } .v #brand img { width: 72px; height: 72px; }
.s #brand { left: 52px; top: 48px; gap: 16px; font-size: 34px; } .s #brand img { width: 54px; height: 54px; }
.h #brand { left: 96px; top: 64px; gap: 18px; font-size: 40px; } .h #brand img { width: 64px; height: 64px; }

.scene { position: absolute; inset: 0; display: none; }
.big { position: absolute; font-weight: 800; letter-spacing: -1.5px; line-height: 1.08; text-shadow: 0 4px 24px rgba(0,0,0,.12); }
.big .w { display: inline-block; white-space: pre; will-change: transform; }
.big .hlw { color: var(--hl); }
.v .big { left: 60px; right: 60px; top: 200px; font-size: 92px; text-align: center; }
.s .big { left: 56px; width: 520px; top: 150px; font-size: 66px; }
.h .big { left: 96px; width: 1000px; top: 230px; font-size: 104px; }
.sub { position: absolute; font-weight: 600; opacity: .88; line-height: 1.3; }
.v .sub { left: 80px; right: 80px; top: 430px; font-size: 44px; text-align: center; }
.s .sub { left: 56px; width: 500px; top: 470px; font-size: 34px; }
.h .sub { left: 96px; width: 980px; top: 520px; font-size: 48px; }

/* text: a centered kinetic statement, no device */
.center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.center .big, .center .sub { position: static; width: auto; text-align: center; }
.v .center { padding: 0 70px 260px; } .s .center { padding: 0 80px 60px; } .h .center { padding: 0 200px 60px; } .f .center { padding: 0 80px 120px; }
.v .center .big { font-size: 128px; } .s .center .big { font-size: 96px; } .h .center .big { font-size: 128px; } .f .center .big { font-size: 104px; }
.v .center .sub { font-size: 50px; margin-top: 44px; } .s .center .sub { font-size: 38px; margin-top: 30px; } .h .center .sub { font-size: 48px; margin-top: 36px; } .f .center .sub { font-size: 40px; margin-top: 32px; }

/* phone */
.phone { position: absolute; border-radius: 15.5% / 7.2%; background: #0d0d12; box-shadow: 0 40px 90px rgba(10,6,40,.45), inset 0 0 0 3px #2b2b33; }
.phone .scr { position: absolute; border-radius: 13.4% / 6.2%; overflow: hidden; background: #f4f4f7; left: 2.4%; right: 2.4%; top: 1.12%; bottom: 1.12%; }
.phone img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.v .phone { width: 560px; height: 1218px; left: 260px; top: 560px; }
.s .phone { width: 410px; height: 892px; left: 608px; top: 120px; }
.h .phone { width: 430px; height: 935px; left: 1300px; top: 100px; }
/* card: the same slot without the bezel, 4:5, for product photos and non-phone visuals */
.phone.card { border-radius: 44px; background: #fff; box-shadow: 0 40px 90px rgba(10,6,40,.40); }
.phone.card .scr { left: 0; right: 0; top: 0; bottom: 0; border-radius: 44px; background: #fff; }
.v .phone.card { width: 820px; height: 1025px; left: 130px; top: 600px; }
.s .phone.card { width: 440px; height: 550px; left: 588px; top: 250px; }
.h .phone.card { width: 640px; height: 800px; left: 1180px; top: 150px; }
.chip { position: absolute; padding: .42em .9em; border-radius: 999px; background: #fff; color: #1d1840; font-weight: 700; white-space: nowrap; box-shadow: 0 14px 40px rgba(10,6,40,.28); display: flex; align-items: center; gap: .4em; }
.chip i { font-style: normal; }
.chip i.dot { width: .55em; height: .55em; border-radius: 50%; background: var(--c1); }
.v .chip { font-size: 40px; } .s .chip { font-size: 30px; } .h .chip { font-size: 36px; }
.label { position: absolute; padding: .35em .9em; border-radius: 999px; background: rgba(20,14,60,.55); backdrop-filter: blur(8px); font-weight: 700; white-space: nowrap; }
.v .label { font-size: 42px; } .s .label { font-size: 30px; } .h .label { font-size: 36px; }

/* chat */
.chat { position: absolute; border-radius: 44px; background: #f2f1f7; box-shadow: 0 40px 90px rgba(10,6,40,.35); overflow: hidden; color: #1d1b26; }
.v .chat { left: 110px; width: 860px; top: 600px; height: 1060px; }
.s .chat { left: 590px; width: 450px; top: 130px; height: 820px; border-radius: 34px; }
.h .chat { left: 1180px; width: 620px; top: 120px; height: 840px; }
.chat .top { background: #fff; display: flex; align-items: center; gap: .5em; font-weight: 700; border-bottom: 2px solid #e6e4ee; }
.v .chat .top { padding: 34px 40px; font-size: 40px; } .s .chat .top { padding: 22px 26px; font-size: 28px; } .h .chat .top { padding: 28px 34px; font-size: 34px; }
.chat .top .ava { width: 1.6em; height: 1.6em; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: .8em; }
.chat .top small { display: block; font-weight: 500; color: #8a879a; font-size: .62em; }
.chat .msgs { overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; height: calc(100% - 4em); }
.v .chat .msgs { padding: 30px 34px; gap: 18px; font-size: 38px; } .s .chat .msgs { padding: 16px 18px; gap: 10px; font-size: 23px; } .h .chat .msgs { padding: 22px 26px; gap: 14px; font-size: 29px; }
.msg { display: flex; align-items: flex-end; gap: .45em; transform-origin: left bottom; }
.msg.me { flex-direction: row-reverse; transform-origin: right bottom; }
.msg .av { flex: none; width: 1.7em; height: 1.7em; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: .78em; }
.msg .bub { max-width: 78%; padding: .55em .85em; border-radius: 1.05em; background: #fff; line-height: 1.3; font-weight: 500; box-shadow: 0 2px 6px rgba(0,0,0,.05); }
.msg .bub b { display: block; font-size: .66em; color: #8a879a; font-weight: 600; margin-bottom: .1em; }
.msg.me .bub { background: var(--c1); color: #fff; }
.msg.emoji .bub { background: none; box-shadow: none; font-size: 2.2em; padding: 0; }

/* feature tiles (trio) */
.tiles { position: absolute; display: flex; flex-direction: column; }
.v .tiles { left: 110px; width: 860px; top: 600px; gap: 36px; }
.s .tiles { left: 600px; width: 430px; top: 190px; gap: 26px; }
.h .tiles { left: 1180px; width: 640px; top: 170px; gap: 34px; }
.tile { display: flex; align-items: center; background: #fff; color: #1d1b26; box-shadow: 0 24px 60px rgba(10,6,40,.28); }
.v .tile { padding: 34px; gap: 34px; border-radius: 44px; } .s .tile { padding: 20px; gap: 20px; border-radius: 30px; } .h .tile { padding: 28px; gap: 28px; border-radius: 38px; }
.tile .ic { flex: none; border-radius: 26%; display: grid; place-items: center; color: #fff; font-weight: 800; }
.v .tile .ic { width: 170px; height: 170px; font-size: 80px; } .s .tile .ic { width: 104px; height: 104px; font-size: 50px; } .h .tile .ic { width: 140px; height: 140px; font-size: 66px; }
.tile .ic img { width: 62%; height: 62%; }
.tile h3 { font-weight: 800; letter-spacing: -.5px; }
.tile p { color: #6c6880; font-weight: 500; margin-top: .2em; }
.v .tile h3 { font-size: 58px; } .v .tile p { font-size: 36px; }
.s .tile h3 { font-size: 36px; } .s .tile p { font-size: 23px; }
.h .tile h3 { font-size: 50px; } .h .tile p { font-size: 31px; }

/* end card */
.endc { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.v .endc { padding-bottom: 300px; } .s .endc { padding-bottom: 120px; } .h .endc { padding-bottom: 140px; }
.endc .icon { border-radius: 23%; box-shadow: 0 30px 80px rgba(10,6,40,.4); }
.endc .icon[src=""] { display: none; }
.v .endc .icon { width: 300px; } .s .endc .icon { width: 190px; } .h .endc .icon { width: 210px; }
.endc h1 { font-weight: 800; letter-spacing: -2px; }
.v .endc h1 { font-size: 120px; margin-top: 50px; } .s .endc h1 { font-size: 84px; margin-top: 28px; } .h .endc h1 { font-size: 104px; margin-top: 30px; }
.endc .tag { font-weight: 600; opacity: .92; }
.v .endc .tag { font-size: 48px; margin-top: 18px; } .s .endc .tag { font-size: 34px; margin-top: 10px; } .h .endc .tag { font-size: 42px; margin-top: 12px; }
.endc .cta { background: #fff; color: var(--c2); font-weight: 800; border-radius: 999px; box-shadow: 0 20px 50px rgba(10,6,40,.35); }
.v .endc .cta { font-size: 56px; padding: 30px 80px; margin-top: 64px; } .s .endc .cta { font-size: 40px; padding: 20px 56px; margin-top: 36px; } .h .endc .cta { font-size: 46px; padding: 24px 70px; margin-top: 42px; }
.endc .pills { display: flex; justify-content: center; }
.endc .pills:empty { display: none; }
.endc .pills span { border: 3px solid rgba(255,255,255,.75); border-radius: 999px; font-weight: 700; background: rgba(255,255,255,.1); }
.v .endc .pills { gap: 28px; margin-top: 50px; } .v .endc .pills span { font-size: 44px; padding: 16px 44px; }
.s .endc .pills { gap: 20px; margin-top: 30px; } .s .endc .pills span { font-size: 32px; padding: 10px 30px; }
.h .endc .pills { gap: 24px; margin-top: 36px; } .h .endc .pills span { font-size: 38px; padding: 12px 38px; }
.endc .url { font-weight: 600; opacity: .8; }
.v .endc .url { font-size: 40px; margin-top: 40px; } .s .endc .url { font-size: 28px; margin-top: 22px; } .h .endc .url { font-size: 34px; margin-top: 26px; }

/* captions */
#cap { position: absolute; z-index: 40; display: flex; justify-content: center; pointer-events: none; }
#cap div { background: rgba(14,10,40,.78); border-radius: 22px; font-weight: 700; line-height: 1.25; text-align: center; }
#cap .w { opacity: .45; } #cap .w.on { opacity: 1; }
.v #cap { left: 60px; right: 60px; bottom: 96px; } .v #cap div { font-size: 50px; padding: 18px 34px; max-width: 960px; }
.s #cap { left: 40px; width: 540px; bottom: 60px; justify-content: flex-start; } .s #cap div { font-size: 34px; padding: 12px 22px; text-align: left; }
.h #cap { left: 96px; width: 1000px; bottom: 90px; justify-content: flex-start; } .h #cap div { font-size: 46px; padding: 16px 30px; text-align: left; }
#fx { position: absolute; inset: 0; z-index: 35; pointer-events: none; }
#flash { position: absolute; inset: 0; z-index: 50; background: #fff; opacity: 0; pointer-events: none; }

/* 4:5 (Facebook/Instagram feed): like .s, 270px taller for a bigger phone and text */
.f #brand { left: 56px; top: 56px; gap: 16px; font-size: 38px; } .f #brand img { width: 60px; height: 60px; }
.f .big { left: 56px; width: 500px; top: 190px; font-size: 70px; }
.f .sub { left: 56px; width: 480px; top: 560px; font-size: 36px; }
.f .center .big, .f .center .sub { width: auto; }
.f .phone { width: 470px; height: 1022px; left: 572px; top: 150px; }
.f .phone.card { width: 470px; height: 588px; left: 572px; top: 280px; }
.f .chip { font-size: 32px; } .f .label { font-size: 32px; }
.f .chat { left: 570px; width: 470px; top: 160px; height: 1000px; border-radius: 36px; }
.f .chat .top { padding: 24px 28px; font-size: 30px; } .f .chat .msgs { padding: 18px 20px; gap: 14px; font-size: 25px; }
.f .tiles { left: 590px; width: 440px; top: 270px; gap: 32px; }
.f .tile { padding: 22px; gap: 22px; border-radius: 32px; } .f .tile .ic { width: 112px; height: 112px; font-size: 54px; }
.f .tile h3 { font-size: 38px; } .f .tile p { font-size: 25px; }
.f .endc { padding-bottom: 160px; } .f .endc .icon { width: 220px; } .f .endc h1 { font-size: 92px; margin-top: 32px; }
.f .endc .tag { font-size: 38px; margin-top: 12px; } .f .endc .cta { font-size: 44px; padding: 22px 62px; margin-top: 44px; }
.f .endc .pills { gap: 22px; margin-top: 36px; } .f .endc .pills span { font-size: 34px; padding: 12px 34px; }
.f .endc .url { font-size: 30px; margin-top: 26px; }
.f #cap { left: 40px; width: 520px; bottom: 80px; justify-content: flex-start; } .f #cap div { font-size: 36px; padding: 14px 24px; text-align: left; }
</style>
</head>
<body>
<div id="bg">
  <div class="blob b1"></div><div class="blob b2"></div>
  <svg id="waves" preserveAspectRatio="none"></svg>
</div>
<div id="brand"><img id="brandIcon" src=""><span id="brandName">App</span></div>
<div id="stage"></div>
<canvas id="fx"></canvas>
<div id="cap"></div>
<div id="flash"></div>
<script>
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x))
const lerp = (a, b, k) => a + (b - a) * k
const outCubic = k => 1 - Math.pow(1 - clamp(k), 3)
const outBack = k => { k = clamp(k); const c = 1.6; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2) }
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
let D, W, H, scenes = [], els = []

function words(text) {
  // "*highlight*" → span.hlw; "\n" → line break; every word is its own span so it can pop in
  const out = []
  for (const [li, line] of text.split('\n').entries()) {
    if (li) out.push('<br>')
    let hl = false
    for (const part of line.split(/(\*)/)) {
      if (part === '*') { hl = !hl; continue }
      for (const w of part.split(/(?<= )/)) if (w) out.push(`<span class="w${hl ? ' hlw' : ''}">${esc(w)}</span>`)
    }
  }
  return out.join('')
}

function setup(data) {
  D = data
  document.body.className = data.aspect
  W = { v: 1080, s: 1080, h: 1920, f: 1080 }[data.aspect]; H = { v: 1920, s: 1080, h: 1080, f: 1350 }[data.aspect]
  const r = document.documentElement.style
  r.setProperty('--c1', data.theme.c1); r.setProperty('--c2', data.theme.c2)
  r.setProperty('--glow', data.theme.glow || '#ff9ad5'); r.setProperty('--hl', data.theme.hl || '#FFE27A')
  // extra fonts from ads.json › fonts (e.g. a CJK or Arabic face), stacked before the default
  if (data.fonts?.length) {
    const st = document.createElement('style')
    st.textContent = data.fonts.map(f => `@font-face { font-family: '${f.family}'; src: url('${f.src}'); font-weight: ${f.weight || 400}; }`).join('\n')
    document.head.appendChild(st)
    r.setProperty('--font', [...new Set(data.fonts.map(f => `'${f.family}'`)), "'Be Vietnam Pro'", 'system-ui', 'sans-serif'].join(', '))
  }
  document.getElementById('brandIcon').src = data.icon || ''
  document.getElementById('brandName').textContent = data.appName
  const fx = document.getElementById('fx'); fx.width = W; fx.height = H
  // soft background waves
  document.getElementById('waves').setAttribute('viewBox', `0 0 ${W} ${H}`)
  document.getElementById('waves').innerHTML = [0, 1, 2].map(k =>
    `<path d="M${-200} ${H * (0.55 + k * 0.12)} C ${W * 0.3} ${H * (0.35 + k * 0.1)}, ${W * 0.6} ${H * (0.85 + k * 0.05)}, ${W + 200} ${H * (0.45 + k * 0.1)}" fill="none" stroke="rgba(255,255,255,${0.10 - k * 0.025})" stroke-width="${70 - k * 16}"/>`).join('')
  const stage = document.getElementById('stage')
  scenes = data.scenes
  for (const s of scenes) {
    const el = document.createElement('div')
    el.className = 'scene k-' + s.type
    let html = ''
    const big = s.big ? `<div class="big">${words(s.big)}</div>` : ''
    const sub = s.sub ? `<div class="sub">${esc(s.sub)}</div>` : ''
    if (s.type !== 'text') html += big + sub
    if (s.type === 'text') {
      html += `<div class="center">${big}${sub}</div>`
    } else if (s.type === 'phone') {
      const fit = s.fit ? ` style="object-fit:${s.fit === 'contain' ? 'contain' : 'cover'}"` : ''
      html += `<div class="phone${s.device === 'card' ? ' card' : ''}"><div class="scr"><img class="a"${fit}><img class="b"${fit}></div></div>`
      for (const c of s.chips || []) html += `<div class="chip">${c.icon ? `<i>${esc(c.icon)}</i>` : '<i class="dot"></i>'}${esc(c.text)}</div>`
      if (s.clips) html += `<div class="label"></div>`
    } else if (s.type === 'chat') {
      const c = s.chat
      html += `<div class="chat"><div class="top"><div class="ava" style="background:${esc(c.color || '#0E9F8E')}">${esc(c.badge || (c.title || '?')[0])}</div><div>${esc(c.title)}<small>${esc(c.subtitle || '')}</small></div></div><div class="msgs">` +
        c.msgs.map(m => m.emoji ? `<div class="msg emoji${m.me ? ' me' : ''}"><div class="bub">${esc(m.emoji)}</div></div>`
          : `<div class="msg${m.me ? ' me' : ''}"><div class="av" style="background:${esc(m.color || '#8a879a')}">${esc((m.who || 'Me')[0])}</div><div class="bub">${m.me ? '' : `<b>${esc(m.who)}</b>`}${esc(m.text)}</div></div>`).join('') + `</div></div>`
    } else if (s.type === 'trio') {
      html += `<div class="tiles">` + (s.items || data.features).map(a => `<div class="tile"><div class="ic" style="background:${esc(a.color || 'var(--c1)')}">${a.icon ? `<img src="${a.icon}">` : esc((a.name || '?')[0])}</div><div><h3>${esc(a.name)}</h3><p>${esc(a.desc || '')}</p></div></div>`).join('') + `</div>`
    } else if (s.type === 'end') {
      html = `<div class="endc"><img class="icon" src="${data.icon || ''}"><h1>${esc(s.title || data.appName)}</h1><div class="tag">${esc(s.tag || '')}</div>` +
        `<div class="cta">${esc(s.cta || '')}</div><div class="pills">${(s.badges || data.badges).map(b => `<span>${esc(b)}</span>`).join('')}</div><div class="url">${esc(s.url ?? data.url ?? '')}</div></div>`
    }
    el.innerHTML = html
    stage.appendChild(el)
    els.push(el)
  }
}

// Default chip positions (pixels) around the phone, per aspect. Override per chip with "pos": [x, y].
const CHIP = {
  v: [[70, 760], [610, 1080], [70, 1400], [600, 640]],
  s: [[600, 240], [560, 560], [640, 800], [560, 400]],
  h: [[1110, 260], [1640, 560], [1130, 800], [1600, 220]],
  f: [[480, 650], [520, 900], [470, 1120], [560, 430]],
}

async function frame(i, t, cap, total, elapsed) {
  const s = scenes[i], el = els[i]
  els.forEach((e, k) => { e.style.display = k === i ? 'block' : 'none' })
  const g = elapsed + t // seconds into the whole video
  // slowly drifting background
  const b = document.querySelectorAll('#bg .blob')
  b[0].style.transform = `translate(${W * 0.55 + Math.sin(g * 0.35) * 160}px, ${-300 + Math.cos(g * 0.3) * 120}px)`
  b[1].style.transform = `translate(${-300 + Math.cos(g * 0.27) * 180}px, ${H * 0.5 + Math.sin(g * 0.33) * 160}px)`
  document.getElementById('waves').style.transform = `translateX(${Math.sin(g * 0.25) * 60}px)`
  const brand = document.getElementById('brand')
  brand.style.opacity = s.type === 'end' || D.noBrand ? 0 : clamp(g / 0.4)

  // headline: every word pops in, staggered
  el.querySelectorAll('.big .w').forEach((w, k) => {
    const k0 = (t - 0.08 - k * 0.055) / 0.35
    w.style.opacity = clamp(k0 * 2)
    w.style.transform = `translateY(${(1 - outBack(k0)) * 60}px) scale(${lerp(0.85, 1, outBack(k0))})`
  })
  const sub = el.querySelector('.sub')
  if (sub) { const k0 = (t - 0.5) / 0.4; sub.style.opacity = clamp(k0) * 0.9; sub.style.transform = `translateY(${(1 - outCubic(k0)) * 30}px)` }

  if (s.type === 'phone') await phoneFrame(s, el, t, i)
  if (s.type === 'chat') chatFrame(s, el, t)
  if (s.type === 'trio') el.querySelectorAll('.tile').forEach((tl, k) => {
    const k0 = (t - 0.15 - k * 0.22) / 0.45
    tl.style.opacity = clamp(k0 * 2)
    tl.style.transform = `translateX(${(1 - outBack(k0)) * 160}px) rotate(${(1 - outCubic(k0)) * 4}deg)`
  })
  if (s.type === 'end') endFrame(s, el, t)
  if (s.type === 'text') { const c = el.querySelector('.center'); c.style.transform = `scale(${lerp(1, 1.04, clamp(t / Math.max(1, s.duration)))})` }
  drawFx(s, t)

  // short white flash on every cut
  document.getElementById('flash').style.opacity = i > 0 ? clamp(0.35 - t * 2.2) : 0

  // captions: the phrase being spoken, words light up as they are said
  const box = document.getElementById('cap')
  if (cap && cap.words && cap.words.length && !D.noCaptions) {
    const k = cap.words.findIndex(w => w.b > cap.at)
    const idx = k === -1 ? cap.words.length - 1 : k
    const grp = chunks(cap.words, D.chunk || 4).find(g => g.includes(cap.words[idx]))
    box.innerHTML = cap.at < cap.words[0].a ? '' : `<div>${grp.map(w => `<span class="w${w.a <= cap.at ? ' on' : ''}">${esc(w.w)} </span>`).join('')}</div>`
  } else box.innerHTML = ''
}

// Caption phrases: at most n words, break early after punctuation so a phrase never splits a short
// clause. build.mjs uses the same rule for the .vtt file.
function chunks(words, n) {
  const out = []; let cur = []
  for (const [i, w] of words.entries()) {
    cur.push(w)
    const left = words.length - i - 1
    const P = /[,.!?:;…]$/, next = words[i + 1]
    if ((P.test(w.w) && cur.length >= 2) || cur.length > n || (cur.length === n && !(left === 1 || (next && P.test(next.w))))) { out.push(cur); cur = [] }
  }
  if (cur.length) out.push(cur)
  return out
}

async function phoneFrame(s, el, t, i) {
  const ph = el.querySelector('.phone')
  const prev = scenes[i - 1]
  const fresh = !prev || prev.type !== 'phone' || (prev.device || 'phone') !== (s.device || 'phone')
  // enter: slide up and tilt; when the previous scene is also a phone, just "punch" in place
  const k = fresh ? outBack(t / 0.55) : 1
  const punch = fresh ? 1 : 1 + 0.035 * Math.sin(clamp(t / 0.3) * Math.PI)
  // zoom magnifies the SCREEN around (x, y), so the layout never shifts; the device itself grows only a little
  const zoom = s.zoom ? lerp(1, s.zoom.s, outCubic((t - (s.zoom.at ?? 0.8)) / 0.7)) : 1
  const floaty = Math.sin((t + i) * 1.6) * 6
  ph.style.transform = `translateY(${(1 - k) * 700 + floaty}px) rotate(${(1 - k) * -8 + (s.tilt || 0)}deg) scale(${punch * (1 + (zoom - 1) * 0.12)})`
  // which media frame to show (a still image has exactly one frame)
  let clip = s, local = t
  if (s.clips) {
    const part = s.duration / s.clips.length
    const j = Math.min(s.clips.length - 1, Math.floor(t / part))
    clip = s.clips[j]; local = t - j * part
    const lb = el.querySelector('.label')
    lb.textContent = clip.label || ''
    lb.style.display = clip.label ? 'block' : 'none'
    const lk = outBack(local / 0.3)
    const pr = ph.getBoundingClientRect()
    lb.style.left = `${pr.left + pr.width / 2}px`
    lb.style.top = D.aspect === 'v' ? `${pr.top - 90}px` : `${pr.bottom - 120}px`
    lb.style.transform = `translate(-50%, ${D.aspect === 'v' ? 0 : -20}px) scale(${lk})`
  }
  const frames = D.frames[clip.media]
  const f = Math.min(frames - 1, Math.max(0, Math.round(((clip.from || 0) + local * (clip.rate || 1)) * 30)))
  const a = el.querySelector('img.a')
  const src = `${D.frameDir}/${clip.media}/${String(f + 1).padStart(5, '0')}.jpg`
  if (a.getAttribute('src') !== src) { a.src = src; try { await a.decode() } catch {} }
  a.style.transformOrigin = s.zoom ? `${s.zoom.x * 100}% ${s.zoom.y * 100}%` : '50% 50%'
  a.style.transform = zoom !== 1 ? `scale(${zoom})` : ''
  // the previous screen slides away and fades (smooth screen change while the phone stays put)
  const bimg = el.querySelector('img.b')
  if (!fresh && t < 0.25 && !s.clips) {
    const pc = prev.clips ? prev.clips[prev.clips.length - 1] : prev
    const pf = D.frames[pc.media] - 1
    const pf2 = Math.min(pf, Math.round(((pc.from || 0) + (prev.clips ? prev.duration / prev.clips.length : prev.duration) * (pc.rate || 1)) * 30))
    const psrc = `${D.frameDir}/${pc.media}/${String(pf2 + 1).padStart(5, '0')}.jpg`
    if (bimg.getAttribute('src') !== psrc) { bimg.src = psrc; try { await bimg.decode() } catch {} }
    bimg.style.display = 'block'; bimg.style.opacity = 1 - t / 0.25
    bimg.style.transform = `translateX(${-outCubic(t / 0.25) * 30}%)`
  } else bimg.style.display = 'none'
  // benefit chips float around the device
  el.querySelectorAll('.chip').forEach((c, k) => {
    const spec = s.chips[k]
    const p = spec.pos || CHIP[D.aspect][k % 4]
    const k0 = (t - (spec.at ?? 0.6 + k * 0.35)) / 0.4
    c.style.left = p[0] + 'px'; c.style.top = p[1] + 'px'
    c.style.opacity = clamp(k0 * 2)
    c.style.transform = `scale(${outBack(k0)}) translateY(${Math.sin((t + k) * 2) * 6}px)`
  })
}

function chatFrame(s, el, t) {
  const card = el.querySelector('.chat')
  const k = outBack(t / 0.45)
  const shake = s.shakeAt != null && t > s.shakeAt ? Math.sin((t - s.shakeAt) * 60) * 10 * Math.max(0, 1 - (t - s.shakeAt) / 0.5) : 0
  card.style.transform = `translate(${shake}px, ${(1 - k) * 400}px) scale(${lerp(0.9, 1, k)})`
  card.style.opacity = clamp(t / 0.2)
  const gap = s.gap || 0.32
  el.querySelectorAll('.msg').forEach((m, j) => {
    const at = (s.chat.msgs[j].at ?? (0.12 + j * gap))
    const k0 = (t - at) / 0.28
    m.style.display = t >= at ? 'flex' : 'none'
    m.style.transform = `scale(${outBack(k0)})`
    m.style.opacity = clamp(k0 * 3)
  })
}

function endFrame(s, el, t) {
  const ic = el.querySelector('.icon'), h1 = el.querySelector('h1'), tag = el.querySelector('.tag'),
    cta = el.querySelector('.cta'), pills = el.querySelector('.pills'), url = el.querySelector('.url')
  const pop = (e, at, dy = 40) => { const k0 = (t - at) / 0.45; e.style.opacity = clamp(k0 * 2); e.style.transform = `translateY(${(1 - outBack(k0)) * dy}px) scale(${lerp(0.8, 1, outBack(k0))})` }
  pop(ic, 0.05, 120); pop(h1, 0.25); pop(tag, 0.4); pop(cta, 0.6); pop(pills, 0.8); pop(url, 0.95)
  const beat = t > 1.1 ? 1 + 0.04 * Math.max(0, Math.sin((t - 1.1) * 6)) : 1
  if (t > 1.1) cta.style.transform = `scale(${beat})`
}

// Confetti for scenes with "confetti": <seconds>. Seeded pseudo-random, so every render is identical.
function drawFx(s, t) {
  const c = document.getElementById('fx'), x = c.getContext('2d')
  x.clearRect(0, 0, W, H)
  if (s.confetti == null || t < s.confetti) return
  const dt = t - s.confetti
  let seed = 11
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647
  const cols = ['#FFE27A', '#FF7AB6', '#7AE2FF', '#9BFF7A', '#ffffff', '#FFB37A']
  for (let n = 0; n < 140; n++) {
    const ox = W * (0.2 + rnd() * 0.6), oy = H * (0.35 + rnd() * 0.1)
    const vx = (rnd() - 0.5) * W * 0.9, vy = -H * (0.35 + rnd() * 0.45)
    const px = ox + vx * dt, py = oy + vy * dt + 0.5 * H * 1.6 * dt * dt
    const sz = (D.aspect === 'v' ? 18 : 14) * (0.6 + rnd() * 0.8)
    const rot = rnd() * 6 + dt * (rnd() * 12 - 6)
    const col = cols[Math.floor(rnd() * cols.length)]
    if (py > H + 40) continue
    x.save(); x.translate(px, py); x.rotate(rot); x.globalAlpha = Math.max(0, 1 - dt / 2.2)
    x.fillStyle = col; x.fillRect(-sz / 2, -sz / 4, sz, sz / 2); x.restore()
  }
}
</script>
